<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Contact Us | CardCraft</title>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <a href="index.html" class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">C</a>
            <span class="text-2xl font-bold text-indigo-600 hidden sm:block">CardCraft</span>
        </div>
        <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
            <i class="fas fa-sun text-yellow-500" id="themeIcon"></i>
        </button>
    </header>

    <main class="container mx-auto px-6 py-12 max-w-4xl">
        <div class="glass rounded-3xl p-8 md:p-12 shadow-xl">
            <h1 class="text-4xl font-bold mb-8 text-center">Contact Us</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <!-- Contact Info -->
                <div class="space-y-8">
                    <div>
                        <h2 class="text-xl font-bold mb-4">Get in Touch</h2>
                        <p class="text-gray-600 dark:text-gray-300">Have questions about our card designer? We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 bg-indigo-100 dark:bg-indigo-900/30 rounded-lg flex items-center justify-center text-indigo-600">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <span>support@cardcraft.com</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 bg-indigo-100 dark:bg-indigo-900/30 rounded-lg flex items-center justify-center text-indigo-600">
                                <i class="fas fa-phone"></i>
                            </div>
                            <span>+1 (555) 000-0000</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 bg-indigo-100 dark:bg-indigo-900/30 rounded-lg flex items-center justify-center text-indigo-600">
                                <i class="fas fa-location-dot"></i>
                            </div>
                            <span>123 Design St, Creative City</span>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <form action="https://formspree.io/f/your-id" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Name</label>
                        <input type="text" name="name" required class="w-full p-3 border rounded-xl bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" name="email" required class="w-full p-3 border rounded-xl bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Message</label>
                        <textarea name="message" rows="4" required class="w-full p-3 border rounded-xl bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary outline-none transition"></textarea>
                    </div>
                    <button type="submit" class="w-full btn-primary py-3">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-8 text-center text-gray-500 border-t dark:border-slate-800">
        <p>&copy; 2024 CardCraft Studio. All rights reserved.</p>
    </footer>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            themeIcon.classList.toggle('fa-sun');
            themeIcon.classList.toggle('fa-moon');
        });
    </script>
</body>
</html>
